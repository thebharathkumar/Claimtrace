[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claimtrace"
version = "0.1.0"
description = "Trace every claim back to its source: a multi-agent due-diligence pipeline with trace observability, source grounding, and a tamper-evident audit chain."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bharath kumar R" }]
keywords = [
  "agents",
  "observability",
  "audit",
  "provenance",
  "langgraph",
  "anthropic",
  "rag",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "langgraph>=0.2,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.23,<1",
  "anthropic>=0.40,<2",
  "pypdf>=4,<7",
  "pydantic>=2,<3",
  "agent-triage>=0.1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=8", "httpx>=0.24"]

[project.scripts]
claimtrace = "claimtrace.cli:main"

[project.urls]
Homepage = "https://github.com/thebharathkumar/claimtrace"

[tool.hatch.build.targets.wheel]
packages = ["src/claimtrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
